# FriendFlix – sign-in: the groups, the OAuth2/OpenID provider and the application (docs/authentik.md).
#
# Import: the FriendFlix setup wizard ("Sign-in" → "Automatic") imports this file through the Authentik API
# together with friendflix-service-account.yaml and friendflix-blueprint.yaml, with the context
#   {"public_url": "<your FriendFlix address, e.g. https://friend.example.com>", "admin_group": "friendflix-admins"}.
# By hand: Customization → Blueprints → Create (unverified), with this file and the same context (public_url has no default: without it
# the redirect URI is wrong). Re-importing is safe (entries are matched by their identifiers and updated, not duplicated).
#
# Creates or updates:
#   - groups <admin_group> (→ ADMIN_GROUP) and "friendflix-users"
#   - OAuth2 provider "FriendFlix": confidential, grant type authorization_code only, redirect URI exactly
#     <public_url>/auth/callback, implicit consent, scopes openid/email/profile, per-provider issuer
#     (→ OIDC_ISSUER = https://auth.example.com/application/o/friendflix/, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET)
#   - application "FriendFlix" (slug friendflix) using that provider
# Authentik 2026.8 creates API and blueprint providers WITHOUT grant types; grant_types must stay in this file.
version: 1
metadata:
  name: FriendFlix - sign-in provider and groups
  labels:
    blueprints.goauthentik.io/description: "Groups, OAuth2 provider and application for signing in to FriendFlix"
context:
  admin_group: friendflix-admins
entries:
  # ---- groups ----
  - model: authentik_core.group
    identifiers:
      name: !Context admin_group
  - model: authentik_core.group
    identifiers:
      name: friendflix-users

  # ---- OAuth2 / OpenID provider ----
  - model: authentik_providers_oauth2.oauth2provider
    id: ff-provider
    identifiers:
      name: FriendFlix
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/auth/callback", !Context public_url]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider

  # ---- application ----
  - model: authentik_core.application
    identifiers:
      slug: friendflix
    attrs:
      name: FriendFlix
      provider: !KeyOf ff-provider
      meta_launch_url: !Context public_url
      policy_engine_mode: any
