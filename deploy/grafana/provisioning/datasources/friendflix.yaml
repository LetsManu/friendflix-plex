# Provisioned by compose.monitoring.yaml. uid is fixed so dashboards and alert rules can reference it.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s # = scrape_interval in deploy/prometheus/prometheus.yml ($__rate_interval)
