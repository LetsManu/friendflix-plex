# Prometheus config for compose.monitoring.yaml (docs/monitoring.md "Prometheus + Grafana").
# Scrapes backend and gateway over the internal `monitoring` network. The bearer token is METRICS_TOKEN, mounted as
# the compose secret /run/secrets/metrics_token (never written into this file).
global:
  scrape_interval: 30s # every backend scrape runs a few small DB queries and pings Redis/Jellyfin; no need to go lower
  evaluation_interval: 30s
scrape_configs:
  - job_name: friendflix-backend
    authorization: { type: Bearer, credentials_file: /run/secrets/metrics_token }
    fallback_scrape_protocol: PrometheusText0.0.4 # plain-text exposition if a response lacks a Content-Type
    static_configs: [{ targets: ["backend:3000"] }]
  - job_name: friendflix-gateway
    authorization: { type: Bearer, credentials_file: /run/secrets/metrics_token }
    fallback_scrape_protocol: PrometheusText0.0.4 # plain-text exposition if a response lacks a Content-Type
    static_configs: [{ targets: ["gateway:4000"] }]
