# PLAN B: nginx (NPM) serves /media/ itself instead of the Node gateway.
# Every request is authorized by the backend (auth_request -> /internal/authz-nginx). The backend validates the
# session + path allowlist, returns the *sanitized upstream URI* and the user's Jellyfin Authorization header,
# and nginx streams straight from Jellyfin (sendfile-grade throughput, no Node in the data path).
#
# SETUP (see docs/operations.md):
#  1. Jellyfin must be reachable from NPM's host: start the stack with `-f compose.yaml -f compose.planb.yaml`
#     (publishes Jellyfin on 127.0.0.1:8096 ONLY; keep 8096 closed in the host firewall).
#  2. Replace __INTERNAL_SECRET__ below with INTERNAL_SECRET from .env (NPM stores this config in its database;
#     the secret only authorizes the auth endpoint, which additionally validates a real session).
#  3. Paste into the Advanced tab of the portal proxy host INSTEAD OF the `location /media/` block of
#     portal.advanced.conf (remove that block, keep /api, /auth, /ws, /internal, /metrics).
#
# Security properties (verified by scripts/test-plan-b.sh):
#  - only GET/HEAD; client Authorization/Cookie/X-Emby-* headers are never forwarded to Jellyfin
#  - the upstream URI comes ONLY from the backend response header (client cannot influence host/path/query)
#  - Jellyfin redirects are not followed, Set-Cookie is dropped, token never appears in a response to the browser
#  - the auth subrequest location is `internal` (unreachable from outside) and /internal/ stays blocked publicly

location = /_ff_authz {
    internal;
    proxy_pass http://127.0.0.1:3081/internal/authz-nginx;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Internal-Secret "__INTERNAL_SECRET__";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
}

# NOTE: offline downloads (/media/d/<uuid>) are NOT supported in Plan B: the auth endpoint denies them (403).
# Set DOWNLOADS_ENABLED=false when running Plan B; downloads need the Node gateway (licence check + Range file serving).
location ^~ /media/ {
    limit_except GET HEAD { deny all; }

    auth_request /_ff_authz;
    auth_request_set $ff_uri  $upstream_http_x_jellyfin_uri;
    auth_request_set $ff_auth $upstream_http_x_jellyfin_auth;

    proxy_pass http://127.0.0.1:8096$ff_uri;

    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host 127.0.0.1:8096;
    proxy_set_header Authorization $ff_auth;
    proxy_set_header Cookie "";
    proxy_set_header X-Emby-Authorization "";
    proxy_set_header X-Emby-Token "";
    proxy_set_header X-MediaBrowser-Token "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
    client_max_body_size 1k;

    proxy_hide_header Set-Cookie;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Cache-Control;
    add_header X-Content-Type-Options nosniff always;
    # images are static per tag: private browser cache; media/playlists stay uncacheable
    set $ff_cache "private, no-store";
    if ($uri ~ "^/media/Items/[0-9a-fA-F]{32}/Images/") { set $ff_cache "private, max-age=86400, stale-while-revalidate=604800"; }
    add_header Cache-Control $ff_cache always;
}
