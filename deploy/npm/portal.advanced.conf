# NPM -> Proxy Host "portal.example.com" -> Advanced tab (custom Nginx configuration)
# Proxy Host: Forward Hostname/IP = 127.0.0.1 (the host running the stack), Port 3080 (SvelteKit UI), scheme http,
# "Websockets Support" ON, "Block Common Exploits" ON, SSL: Force SSL + HTTP/2 + HSTS.
# The stack publishes web/backend/gateway on 127.0.0.1:3080/3081/3082 (BIND_ADDR, WEB_PORT, BACKEND_PORT, GATEWAY_PORT).
# NPM on the same host (host network) uses 127.0.0.1. If NPM runs in a bridge container, use the Docker host IP
# (e.g. 172.17.0.1 or host.docker.internal) and set BIND_ADDR in .env to that address - never 0.0.0.0 on a public interface.

# ---- API + login: backend ----
location /api/ {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
}
location /auth/ {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# (Alternative Plan B: nginx serves /media/ itself -> deploy/npm/plan-b-auth-request.conf, replaces this block)
# ---- Video/image/subtitle traffic goes to the Gateway: no buffering, Range passthrough ----
location /media/ {
    proxy_pass http://127.0.0.1:3082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
    client_max_body_size 1m;
}

# ---- Chromecast: the receiver has no cookies, so the token is part of the path (/media/c/<token>/...) ----
# Same proxy settings as /media/ (longer prefix wins), but access_log off: the URL IS the credential and must not end up in logs.
# Not available with Plan B (auth_request): there /media/c/ is not routed to the gateway and casting stays disabled.
location /media/c/ {
    access_log off;
    # nginx also writes the request URI (= the token) into error_log lines (upstream timeouts, etc.): discard them for this location
    error_log /dev/null;
    proxy_pass http://127.0.0.1:3082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
    client_max_body_size 1m;
}

# ---- Watch party / now-playing WebSockets ----
location /ws/ {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---- Webhooks from Jellyfin/the request service use the internal network, never the public host ----
location /internal/ { return 404; }
location /metrics { return 404; }
location /health/ready { return 404; }
