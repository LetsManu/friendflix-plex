# FriendFlix portal stack - PRODUCTION variant: pulls the prebuilt images from ghcr.io (no build on the server).
# Images come from .github/workflows/publish.yml. Private packages: docker login ghcr.io -u <user> (PAT with read:packages).
# Channel / version with FF_TAG in .env: latest = stable releases (default), nightly = every green commit on main, 1 / 1.1 / 1.1.0
# or a short sha to pin; other owner with FF_REGISTRY=ghcr.io/<owner> (both optional). Admin -> Update shows the line to set.
# Opt-in updater (`--profile updater`, with compose.plex.yaml; docs/operations.md "Updater"): Admin -> Update then pulls, verifies (cosign) and restarts
# the FriendFlix services itself and FF_TAG is no longer needed; only the `docker-proxy` service sees the Docker socket.
# FriendFlix portal stack. A new install needs no .env: `up -d`, then the setup code from the backend log
# (`logs backend | grep "setup code"`) opens the setup wizard (docs/setup.md); every setting lives in the database (Admin -> Settings).
# The `bootstrap` service generates the internal secrets into the `bootstrap` volume (back it up, scripts/backup-bootstrap.sh).
# - NPM runs OUTSIDE Docker (or in its own stack) and reaches the portal through three ports that are bound to
#   127.0.0.1 only (BIND_ADDR): web, backend (API/auth/WebSocket) and gateway (/media). Nothing else is published.
# - Jellyfin and the request service have NO ports and are only reachable via the internal `media` network.
# - `db` network is internal (no egress, no host access).
# NPM proxy host -> 127.0.0.1:${WEB_PORT}; locations /api,/auth,/ws -> :${BACKEND_PORT}, /media -> :${GATEWAY_PORT}
# (ready-made config: deploy/npm/portal.advanced.conf).

name: friendflix

networks:
  # `front` is a normal bridge: Docker can only publish ports for containers that sit on a non-internal network
  front: {}
  db:
    internal: true
  media:
    internal: true
  egress: {} # outbound internet for Jellyfin/request service metadata only; nothing is published
  # updater profile: backend <-> updater (signed requests), updater <-> socket proxy, updater -> ghcr.io / Sigstore (cosign).
  # Defined always (backend joins `updater`), empty without the profile.
  updater:
    internal: true
  updater-docker:
    internal: true
  updater-egress: {}

services:
  # Init container (runs once per `up`, then exits): writes every secret needed before the database can be read into the
  # `bootstrap` volume (postgres_password, redis_password, redis.conf, app_enc_key, internal_secret; root:10001, 0440) and
  # the gateway's copy of internal_secret into `bootstrap-gateway`. A new install sets none of them. Existing installs:
  # the four values below win when set in .env and are copied into the volume on every start. It logs file names only.
  bootstrap:
    image: ${FF_REGISTRY:-ghcr.io/letsmanu}/friendflix-plex-backend:${FF_TAG:-latest}
    pull_policy: always
    command: ["node", "backend/dist/bootstrap.js"]
    user: "0:0" # owns the files; no capability but CHOWN (hands the group to 10001), no network
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    restart: "no"
    healthcheck: { disable: true } # the image's HTTP check is for the backend; this one only has to exit 0
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      APP_ENC_KEY: ${APP_ENC_KEY:-}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
    volumes:
      - bootstrap:/run/friendflix
      - bootstrap-gateway:/run/friendflix-gateway

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: friendflix
      POSTGRES_USER: friendflix
      # the entrypoint reads the file as root before it drops to uid 70; only used when the data directory is created
      POSTGRES_PASSWORD_FILE: /run/friendflix/postgres_password
    volumes: [pgdata:/var/lib/postgresql/data, bootstrap:/run/friendflix:ro]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friendflix"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s   # first initialisation is slow on NAS disks

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass comes from the bootstrap volume; runs as the image's redis user plus the secrets group (reads redis.conf)
    command: ["redis-server", "/run/friendflix/redis.conf", "--save", "", "--appendonly", "no"]
    user: "999:999"
    group_add: ["10001"]
    read_only: true
    volumes: [bootstrap:/run/friendflix:ro]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/friendflix/redis_password)\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    image: ${FF_REGISTRY:-ghcr.io/letsmanu}/friendflix-plex-backend:${FF_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # secrets group: reads the bootstrap volume (DATABASE_URL, REDIS_URL, APP_ENC_KEY and INTERNAL_SECRET derive from it)
    group_add: ["10001"]
    # Every setting below is optional: set in the browser (Admin -> Settings) and stored in the database.
    # A value set here (.env) still wins and shows locked ("from environment"); the lines only pass existing .env values through.
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      APP_ENC_KEY: ${APP_ENC_KEY:-}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      ADMIN_GROUP: ${ADMIN_GROUP:-}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      MEDIA_SERVER: ${MEDIA_SERVER:-jellyfin}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_ADMIN_API_KEY: ${JELLYFIN_ADMIN_API_KEY:-}
      OIDC_ALLOW_INSECURE: ${OIDC_ALLOW_INSECURE:-false}
      # request service (optional); the two old-name lines below only keep older .env files working (they log a deprecation warning)
      REQUESTS_URL: ${REQUESTS_URL:-}
      REQUESTS_API_KEY: ${REQUESTS_API_KEY:-}
      SEERR_URL: ${SEERR_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      NTFY_URL: ${NTFY_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # optional external data sources (detail page); can also be saved in the admin UI
      # TMDB_API_KEY: ${TMDB_API_KEY:-}
      # OMDB_API_KEY: ${OMDB_API_KEY:-}
      TZ: ${TZ:-Europe/Vienna}
      DIGEST_DAY: ${DIGEST_DAY:-0}
      DIGEST_HOUR: ${DIGEST_HOUR:-18}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      AUTHENTIK_URL: ${AUTHENTIK_URL:-}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-}
      AUTHENTIK_ENROLL_FLOW: ${AUTHENTIK_ENROLL_FLOW:-}
      AUTHENTIK_RECOVERY_FLOW: ${AUTHENTIK_RECOVERY_FLOW:-}
      AUTHENTIK_TOTP_SETUP_FLOW: ${AUTHENTIK_TOTP_SETUP_FLOW:-}
      UPDATE_REPO: ${UPDATE_REPO:-LetsManu/friendflix-plex}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PORTAINER_WEBHOOK_URL: ${PORTAINER_WEBHOOK_URL:-}
      PORTAINER_URL: ${PORTAINER_URL:-}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY:-}
      PORTAINER_STACK_ID: ${PORTAINER_STACK_ID:-}
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID:-}
      PLAYBACK_CHECK_HOUR: ${PLAYBACK_CHECK_HOUR:-}
      PREVIEW_WARM: ${PREVIEW_WARM:-}
      # recommendation index (docs/discovery.md): weight of each feature group (0-10; 0 = off)
      RECO_W_GENRES: ${RECO_W_GENRES:-}
      RECO_W_TAGS: ${RECO_W_TAGS:-}
      RECO_W_STUDIOS: ${RECO_W_STUDIOS:-}
      RECO_W_PEOPLE: ${RECO_W_PEOPLE:-}
      RECO_W_TEXT: ${RECO_W_TEXT:-}
      RECO_W_NUMERIC: ${RECO_W_NUMERIC:-}
      RECO_W_COLLECTION: ${RECO_W_COLLECTION:-}
      # recommendation engine v2: v1 | shadow | v2, decay half-life in days, JSON overrides of the scoring coefficients
      RECO_ENGINE: ${RECO_ENGINE:-}
      RECO_HALF_LIFE_DAYS: ${RECO_HALF_LIFE_DAYS:-}
      RECO_COEFFS: ${RECO_COEFFS:-}
      RECO_EXPLORE: ${RECO_EXPLORE:-}
      # download preparation + cleanup, audio/subtitle language index, Jellyfin session polling; false only for extra replicas
      BACKGROUND_JOBS: ${BACKGROUND_JOBS:-true}
      # gzip/brotli for JSON API responses >= 1 KB; false when the reverse proxy already compresses
      API_COMPRESSION: ${API_COMPRESSION:-}
      # admin health page: gateway address (only /health is called) and disk / database warning levels
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:4000}
      # opt-in updater (profile `updater`); without the profile the name does not resolve and Admin -> Update shows the manual steps
      UPDATER_URL: ${UPDATER_URL:-http://updater:7070}
      HEALTH_DISK_WARN_PCT: ${HEALTH_DISK_WARN_PCT:-}
      HEALTH_DISK_CRIT_PCT: ${HEALTH_DISK_CRIT_PCT:-}
      HEALTH_DB_WARN_GB: ${HEALTH_DB_WARN_GB:-}
      CAST_ENABLED: ${CAST_ENABLED:-}
      POSTPLAY_ENABLED: ${POSTPLAY_ENABLED:-}
      DOWNLOADS_ENABLED: ${DOWNLOADS_ENABLED:-}
      DIRECT_PLAY_REQUIRES_DOWNLOAD: ${DIRECT_PLAY_REQUIRES_DOWNLOAD:-}
      DOWNLOAD_DIR: /data/downloads
      DOWNLOAD_CACHE_MAX_GB: ${DOWNLOAD_CACHE_MAX_GB:-}
      DOWNLOAD_PREP_CONCURRENCY: ${DOWNLOAD_PREP_CONCURRENCY:-}
      DOWNLOAD_CREATE_PER_HOUR: ${DOWNLOAD_CREATE_PER_HOUR:-}
      DOWNLOAD_MIN_FREE_GB: ${DOWNLOAD_MIN_FREE_GB:-}
      DOWNLOAD_PAUSE_STREAMS: ${DOWNLOAD_PAUSE_STREAMS:-}
      DOWNLOAD_FILE_TTL_HOURS: ${DOWNLOAD_FILE_TTL_HOURS:-}
      DOWNLOAD_OFFLINE_GRACE_DAYS: ${DOWNLOAD_OFFLINE_GRACE_DAYS:-}
    # root fs is read-only. PREVIEWS_PATH / DOWNLOADS_PATH: named volume by default, or a host folder
    # (e.g. /mnt/data/friendflix/downloads, must be writable by uid 1000) - see docs/downloads.md "Speicherort"
    volumes:
      - ${PREVIEWS_PATH:-previews}:/data/previews # cached hover/billboard clips
      - ${DOWNLOADS_PATH:-downloads}:/data/downloads # prepared offline-download MP4s (rw here, ro in the gateway)
      - bootstrap:/run/friendflix:ro
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-3081}:3000"]
    networks: [front, db, media, egress, updater] # egress: OIDC discovery + ntfy/Discord; updater: the opt-in updater only

  gateway:
    image: ${FF_REGISTRY:-ghcr.io/letsmanu}/friendflix-plex-gateway:${FF_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MEDIA_SERVER: ${MEDIA_SERVER:-jellyfin}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      BACKEND_URL: http://backend:3000
      INTERNAL_SECRET: ${INTERNAL_SECRET:-} # unset: the copy in the bootstrap-gateway volume
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DOWNLOAD_DIR: /data/downloads
    group_add: ["10001"] # reads bootstrap-gateway (internal_secret only: never the database password or the encryption key)
    volumes:
      - ${DOWNLOADS_PATH:-downloads}:/data/downloads:ro # same folder as the backend, read-only
      - bootstrap-gateway:/run/friendflix-gateway:ro
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      backend: { condition: service_started }
    ports: ["${BIND_ADDR:-127.0.0.1}:${GATEWAY_PORT:-3082}:4000"]
    networks: [front, media]

  web:
    image: ${FF_REGISTRY:-ghcr.io/letsmanu}/friendflix-plex-web:${FF_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # the origin comes from the request (Host + X-Forwarded-Proto, set by the reverse proxy); adapter-node 6 reads no ORIGIN
      PROTOCOL_HEADER: x-forwarded-proto
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    ports: ["${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3080}:3000"]
    networks: [front]

  # Nightly pg_dump sidecar (opt-in): `docker compose --profile backup up -d backup`  (docs/operations.md "Backups & Wiederherstellung")
  # Host dir must be writable by uid 70:  mkdir -p backups && chown 70 backups
  # Runs daily at BACKUP_HOUR (container TZ), dumps to a temp file, verifies with `pg_restore --list`, then renames and prunes.
  backup:
    profiles: [backup]
    image: postgres:17-alpine # keep the same major version as `postgres`
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    user: "70:70"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    group_add: ["10001"] # reads postgres_password from the bootstrap volume
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-} # wins when set; otherwise PGPASSWORD_FILE is read
      # password file: the bootstrap volume's by default, or a mounted file (e.g. a Docker secret)
      PGPASSWORD_FILE: ${BACKUP_PGPASSWORD_FILE:-/run/friendflix/postgres_password}
      TZ: ${TZ:-Europe/Vienna}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-${KEEP_DAYS:-14}}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
    volumes: ["${BACKUP_PATH:-./backups}:/backups", "bootstrap:/run/friendflix:ro"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        S=/tmp/backup.status
        log() { echo "$$(date '+%Y-%m-%d %H:%M:%S') backup: $$*"; }
        [ -z "$${PGPASSWORD:-}" ] && [ -r "$${PGPASSWORD_FILE:-}" ] && PGPASSWORD=$$(cat "$$PGPASSWORD_FILE") && export PGPASSWORD
        run() {
          f=/backups/friendflix-$$(date +%Y%m%d-%H%M).dump
          if pg_dump -h postgres -U friendflix -Fc -f "$$f.tmp" friendflix && [ -s "$$f.tmp" ] \
             && pg_restore --list "$$f.tmp" > /dev/null && mv "$$f.tmp" "$$f"; then
            find /backups -maxdepth 1 -name 'friendflix-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
            log "OK $$f ($$(wc -c < "$$f") bytes), kept $$(ls /backups/friendflix-*.dump | wc -l) dumps, retention $${BACKUP_KEEP_DAYS}d"
            echo OK > $$S
          else
            rc=$$?
            rm -f "$$f.tmp"
            log "FAIL exit=$$rc ($$f)"
            echo FAIL > $$S
          fi
        }
        [ "$$BACKUP_RUN_ON_START" = true ] && run
        while true; do
          h=$$(date +%H); m=$$(date +%M); s=$$(date +%S)
          wait=$$(( ($${BACKUP_HOUR} - $${h#0}) * 3600 - $${m#0} * 60 - $${s#0} ))
          [ $$wait -le 0 ] && wait=$$(( wait + 86400 ))
          log "next run in $${wait}s (daily at $${BACKUP_HOUR}:00 $${TZ})"
          sleep $$wait
          run
        done
    healthcheck:
      # unhealthy when the last run failed (no status file yet = fine, the first run is up to 24 h away)
      test: ["CMD-SHELL", "! grep -q FAIL /tmp/backup.status 2>/dev/null"]
      interval: 5m
      timeout: 5s
      retries: 1
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    networks: [db]

  # ---- Opt-in updater: `docker compose -f compose.prod.yaml -f compose.plex.yaml --profile updater up -d` (docs/operations.md "Updater") ----
  # The ONLY service with the Docker socket, read-only, on an internal network that only the updater shares. It forwards the
  # API sections `compose pull` + `up -d --no-deps` need (containers, images, networks, volumes, info); exec, build, commit,
  # swarm, services, secrets, configs, plugins, system, session, distribution, auth and the container archive/export/logs/
  # top/changes endpoints are refused (403). Third-party image pinned by digest (Dependabot does not see it: bump by hand).
  # haproxy runs as root inside (`user root` + `chroot /` in its config): it keeps only the three capabilities for that.
  docker-proxy:
    profiles: [updater]
    image: ghcr.io/linuxserver/socket-proxy:3.4.7@sha256:e5d819de59b343c01b2fe7adc7fad3c7a60e5dba08e45f1ac317352bc08599b5
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID, SYS_CHROOT]
    security_opt: ["no-new-privileges:true"]
    environment:
      # read: what compose inspects (containers, images, networks, volumes) plus ping/version/info
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      PING: 1
      VERSION: 1
      EVENTS: 0
      # write (POST/DELETE) in the sections above: pull, create/recreate, start/stop/remove of containers. Note: with
      # CONTAINERS + POST the proxy also lets kill/restart/pause through; ALLOW_* only add allows, they never deny.
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 0
      # everything else stays denied
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      ALLOW_ARCHIVE: 0
      ALLOW_EXPORT: 0
      ALLOW_LOGS: 0
      ALLOW_PAUSE: 0
      ALLOW_UNPAUSE: 0
      ALLOW_TOP: 0
      ALLOW_CHANGES: 0
      AUTH: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      DISABLE_IPV6: 0
      LOG_LEVEL: warning
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [updater-docker]

  # Pulls + cosign-verifies + recreates the FriendFlix services (bootstrap, backend, gateway, web) on signed requests from the
  # backend only (INTERNAL_SECRET). No published port. Reads the stack directory read-only at its host path (relative bind paths
  # resolve the same) and needs it plus .env readable by uid 1000. Never touches the database, Redis, Jellyfin, the request
  # service or Authentik.
  updater:
    profiles: [updater]
    image: ${FF_REGISTRY:-ghcr.io/letsmanu}/friendflix-plex-updater:${FF_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    group_add: ["10001"] # reads bootstrap-gateway (internal_secret only)
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      UPDATER_PROJECT_DIR: ${PWD:-/project}
      # extra compose files of this stack (comma-separated names in the stack directory), e.g. compose.prod.yaml,compose.authentik.yaml
      UPDATER_COMPOSE_FILES: ${UPDATER_COMPOSE_FILES:-compose.prod.yaml}
      UPDATE_REPO: ${UPDATE_REPO:-LetsManu/friendflix-plex} # expected images ghcr.io/<owner>/friendflix-plex-* + cosign signer
      INTERNAL_SECRET: ${INTERNAL_SECRET:-} # unset: the copy in the bootstrap-gateway volume
    volumes:
      - .:${PWD:-/project}:ro
      - updater-state:/state
      - bootstrap-gateway:/run/friendflix-gateway:ro
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      docker-proxy: { condition: service_started }
    networks: [updater, updater-docker, updater-egress]

  # Optional bundled media services. Remove this profile if you already run them;
  # then attach your existing containers to the `friendflix_media` network instead.
  jellyfin:
    profiles: [bundled]
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_PATH:-./media}:/media:ro
    networks: [media, egress] # no ports, no NPM host (Plan B: see compose.planb.yaml)

  # request service (upstream image)
  requests:
    profiles: [bundled]
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    volumes: [requests-config:/app/config]
    networks:
      # previous service name kept as a network alias, so existing URLs and webhooks keep working
      media: { aliases: [seerr] }
      egress: {}

volumes:
  # generated secrets (bootstrap service): back it up apart from the database dumps, see scripts/backup-bootstrap.sh
  bootstrap:
  bootstrap-gateway:
  pgdata:
  updater-state: # channel, installed + previous tag, last job (profile updater)
  previews:
  downloads:
  jellyfin-config:
  jellyfin-cache:
  requests-config:
    # existing volume name, kept so upgrades keep the request service's data
    name: ${COMPOSE_PROJECT_NAME:-friendflix}_seerr-config
