# Optional override: feed the most sensitive values via Docker secrets (files) instead of environment variables.
#   mkdir -p secrets && openssl rand -base64 32 > secrets/app_enc_key && ... (chmod 600, never commit: secrets/ is gitignored)
#   docker compose -f compose.yaml -f compose.secrets.yaml up -d
# The backend/gateway read VAR_FILE=/run/secrets/<name> (see backend/src/config.ts).
# A VAR_FILE secret wins over the bootstrap volume (env layer): APP_ENC_KEY and INTERNAL_SECRET come from these files then,
# and the copies the `bootstrap` service generates into its volume stay unused. Back up ./secrets instead.
secrets:
  app_enc_key: { file: ./secrets/app_enc_key }
  internal_secret: { file: ./secrets/internal_secret }
  webhook_secret: { file: ./secrets/webhook_secret }
  oidc_client_secret: { file: ./secrets/oidc_client_secret }
  jellyfin_api_key: { file: ./secrets/jellyfin_api_key }
  requests_api_key: { file: ./secrets/requests_api_key } # request service API key
  # Web Push: node scripts/gen-vapid.mjs, private key into this file. The file MUST exist (compose refuses to start otherwise):
  # without Web Push create it empty (`touch secrets/vapid_private_key`); an empty value counts as unset = push disabled.
  vapid_private_key: { file: ./secrets/vapid_private_key }
  # Optional: TMDB / OMDb keys as files (create secrets/tmdb_api_key / secrets/omdb_api_key, then uncomment the matching lines below).
  # tmdb_api_key: { file: ./secrets/tmdb_api_key }
  # omdb_api_key: { file: ./secrets/omdb_api_key }
services:
  backend:
    secrets: [app_enc_key, internal_secret, webhook_secret, oidc_client_secret, jellyfin_api_key, requests_api_key, vapid_private_key] # + tmdb_api_key, omdb_api_key when enabled
    environment:
      APP_ENC_KEY: !reset null
      INTERNAL_SECRET: !reset null
      WEBHOOK_SECRET: !reset null
      OIDC_CLIENT_SECRET: !reset null
      JELLYFIN_ADMIN_API_KEY: !reset null
      REQUESTS_API_KEY: !reset null
      SEERR_API_KEY: !reset null
      VAPID_PRIVATE_KEY: !reset null
      APP_ENC_KEY_FILE: /run/secrets/app_enc_key
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      JELLYFIN_ADMIN_API_KEY_FILE: /run/secrets/jellyfin_api_key
      REQUESTS_API_KEY_FILE: /run/secrets/requests_api_key
      VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      # TMDB_API_KEY_FILE: /run/secrets/tmdb_api_key
      # OMDB_API_KEY_FILE: /run/secrets/omdb_api_key
  gateway:
    secrets: [internal_secret]
    environment:
      INTERNAL_SECRET: !reset null
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
