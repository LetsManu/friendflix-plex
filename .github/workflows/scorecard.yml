# OpenSSF Scorecard: supply-chain health checks (branch protection, pinned actions, token permissions, ...).
# Results: code scanning (category "scorecard") + public badge on scorecard.dev (publish_results, needs a public repo).
# publish_results restricts this job: no workflow-level env/defaults, no write permissions at workflow level and only
# a small set of allowed actions in the job (checkout, scorecard-action, upload-artifact, upload-sarif).
name: Scorecard
on:
  branch_protection_rule: # re-score when branch protection changes
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday 04:27 UTC
  push:
    branches: [main]
permissions: read-all
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF upload
      id-token: write # publish_results: proves to scorecard.dev that the results come from this repo's workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
