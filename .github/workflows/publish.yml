name: Publish images
# Does NOT build. Re-tags the image that CI already built and scanned (ghcr.io/<owner>/friendflix-<service>:ci-<git sha>,
# see the top of ci.yml) to the release tags - same manifest digest, no second build.
# Tags: latest + short sha on main, vX.Y.Z on version tags.
# Called by CI after tests, secret scan and image scan pass; workflow_dispatch is the manual escape hatch
# (only works for a commit whose CI run pushed its ci-<sha> images; run it on that commit's ref).
on:
  workflow_call:
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [backend, gateway, web] }
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Image name (GHCR needs lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/friendflix-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - name: Re-tag the scanned image
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:ci-$GITHUB_SHA" --format '{{.Manifest.Digest}}') \
            || { echo "::error::$IMAGE:ci-$GITHUB_SHA not found - CI has not built/scanned this commit"; exit 1; }
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          echo "Promoting $IMAGE@$digest -> ${args[*]}"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$digest"
