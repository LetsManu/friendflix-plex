name: Publish images
# Does NOT build. Re-tags the image that CI already built and scanned (ghcr.io/<owner>/friendflix-<service>:ci-<git sha>,
# see the top of ci.yml) to the release tags - same manifest digest, no second build.
# Tags: latest + short sha on main; X.Y.Z, X.Y, X + short sha on vX.Y.Z tags (cut by release.yml), plus latest when the
# tag is the highest plain vX.Y.Z (backports and pre-releases never move latest).
# Called by CI after tests, secret scan and image scan pass; workflow_dispatch is the manual escape hatch
# (only works for a commit whose CI run pushed its ci-<sha> images; run it on that commit's ref).
# After promotion the digest is signed with cosign KEYLESS (GitHub OIDC -> Fulcio cert, Rekor log; no keys or secrets)
# and gets GitHub artifact attestations (SLSA provenance + the BuildKit SPDX SBOM), pushed next to the image in GHCR.
# Signer identity = this workflow file in the repo that runs it, so forks sign as themselves:
#   https://github.com/<owner>/<repo>/.github/workflows/publish.yml@<ref>   (verification: docs/operations.md)
# Never runs on pull_request (CI calls it only for push events).
on:
  workflow_call:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # re-tag + push signature/attestations
      id-token: write # cosign keyless + attestation signing (Sigstore)
      attestations: write # GitHub attestation store (gh attestation verify)
    strategy:
      matrix: { service: [backend, gateway, web] }
    steps:
      # tags only: decides whether this version is the highest release (only then it may move `latest`)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - name: latest? (main, or the highest plain vX.Y.Z tag)
        id: latest
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          enable=false
          if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            enable=true
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # fetch-depth 0 brought every tag
            top=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | awk 'NR == 1' || true)
            if [ "$top" = "$GITHUB_REF_NAME" ]; then enable=true; fi
          fi
          # backports (v1.2.3 after v1.3.0), pre-releases (-rc.1) and odd tags never move latest
          echo "Ref $GITHUB_REF: latest=$enable"
          echo "enable=$enable" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Image name (GHCR needs lowercase)
        id: img
        run: repo="${GITHUB_REPOSITORY#*/}"; echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${repo,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"   # friendflix-<svc>; forks get <repo>-<svc>
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.img.outputs.name }}
          # main: latest + short sha. vX.Y.Z tag: X.Y.Z, X.Y, X (pin `:1` to stay on a major line), and latest only when it
          # is the highest plain version (release.yml may push with GITHUB_TOKEN, which starts no CI run for main itself).
          # Pre-release tags get X.Y.Z-rc.N only (metadata-action skips X.Y / X for them).
          tags: |
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Re-tag the scanned image
        id: promote
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:ci-$GITHUB_SHA" --format '{{.Manifest.Digest}}') \
            || { echo "::error::$IMAGE:ci-$GITHUB_SHA not found - CI has not built/scanned this commit"; exit 1; }
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          echo "Promoting $IMAGE@$digest -> ${args[*]}"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign digest (cosign keyless)
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Extract SBOM (SPDX, attached by BuildKit in ci.yml)
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{ json .SBOM.SPDX }}' > "$RUNNER_TEMP/sbom.spdx.json"
          jq -e '.spdxVersion' "$RUNNER_TEMP/sbom.spdx.json" > /dev/null \
            || { echo "::error::$IMAGE@$DIGEST has no SPDX SBOM (built without sbom: true?)"; exit 1; }
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # storage records only exist for organization-owned repos
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
