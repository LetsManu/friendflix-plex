# CI flow: test + secrets scan + image build/scan, then (push only) publish.
# Images are built exactly ONCE, in the `docker` job:
#   pull_request     build with load:true (no push, forks cannot write packages) and scan the local image.
#   push (main, v*)  build, push as ghcr.io/<owner>/friendflix-<svc>:ci-<git sha> and scan that exact digest with trivy.
# publish.yml (called after test, secrets and docker all passed) does NOT rebuild: it only re-tags the already scanned
# image (`docker buildx imagetools create`) to latest / short sha / semver. What gets released is what was scanned.
# A failed scan leaves only the unreleased `ci-<sha>` tag in GHCR (never latest); prune old ci-* tags from time to time.
# Supply chain (push only): the candidate carries BuildKit SBOM (SPDX) + SLSA provenance (mode=max) attestations, Trivy
# findings go to code scanning as SARIF, and publish.yml signs the promoted digest with cosign keyless (GitHub OIDC) and
# adds GitHub artifact attestations (provenance + SBOM). Nothing on pull_request can write packages, sign or attest.
# DAST: `dast` runs an OWASP ZAP baseline scan against the built web app (rules: .zap/rules.tsv).
# workflow_dispatch: release.yml starts CI for the new vX.Y.Z tag (its own pushes use GITHUB_TOKEN and trigger nothing);
# a dispatch behaves like a push of that ref, but only main and v* tags are ever published.
# Images carry APP_VERSION / APP_CODENAME from version.json next to GIT_SHA.
# Reproducible builds (docs/reproducible-builds.md): SOURCE_DATE_EPOCH = commit time, rewrite-timestamp=true, pinned
# BuildKit (BUILDKIT_IMAGE), BUILD_TIME and the `created` label derived from the commit time; the published candidate is
# built without cache import. The `reproducible` job rebuilds every image from scratch and requires the same digest.
name: CI
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
env:
  # BuildKit that builds every image, here and in scripts/reproduce-image.sh (which reads this line): the same commit only
  # yields the same bytes with the same BuildKit. Pinned by digest; Dependabot does not see it, bump tag + digest by hand.
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # 22 = oldest supported (engines >=22), 26 = runtime of all images
      matrix: { node: [22, 26] }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_USER: postgres, POSTGRES_DB: ff_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run spdx:check
      - run: npm run typecheck
      # newest Node: tests run once, with coverage (fails below the thresholds in each vitest.config.ts); other entries run plain tests
      - run: npm test
        if: matrix.node != 26
      - name: Tests with coverage
        if: matrix.node == 26
        run: npm run coverage && npm run test:scripts
      - name: Coverage summary
        if: matrix.node == 26
        run: |
          {
            echo "## Test coverage"
            echo "| Package | Statements | Branches | Functions | Lines |"
            echo "|---|---|---|---|---|"
            for pkg in backend gateway web; do
              jq -r --arg p "$pkg" '.total | "| \($p) | \(.statements.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.lines.pct)% |"' "$pkg/coverage/coverage-summary.json"
            done
            # overall: covered / total summed over the three packages
            jq -s -r 'def pct(k): (([.[].total[k].covered] | add) * 10000 / ([.[].total[k].total] | add) | floor) / 100; "| **overall** | \(pct("statements"))% | \(pct("branches"))% | \(pct("functions"))% | \(pct("lines"))% |"' backend/coverage/coverage-summary.json gateway/coverage/coverage-summary.json web/coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.node == 26
        with:
          name: coverage
          path: |
            backend/coverage/
            gateway/coverage/
            web/coverage/
          retention-days: 14
      - name: Dependency audit (prod, high+)
        if: matrix.node == 22
        run: npm audit --omit=dev --audit-level=high
  # browser tests against the built web app with a fully mocked API (no backend, Postgres or Jellyfin needed)
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { E2E_SKIP_BUILD: "1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm } # same as the web image
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w web
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
  # OWASP ZAP baseline (passive) scan against the built web app, started like in `e2e` (node web/build, no backend).
  # Fails on High-risk alerts, Medium/Low become warnings. Suppressions with reasons: .zap/rules.tsv. Report: artifact `zap-report`.
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # pinned by digest; bump together with the tag (Dependabot does not update `docker run` lines)
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2
      TARGET: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm } # same as the web image
      - run: npm ci
      - run: npm run build -w web
      - name: Start web app
        run: |
          PORT=4173 HOST=127.0.0.1 ORIGIN="$TARGET" nohup node web/build > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS -o /dev/null "$TARGET/offline" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/web.log"; exit 1
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap   # the ZAP container runs as uid 1000
          cp .zap/rules.tsv zap/rules.tsv
          docker pull -q "$ZAP_IMAGE"
          # -I: warnings never fail here; the gate below decides. Exit 1 = a rule set to FAIL in rules.tsv, 3 = scan error.
          rc=0
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$TARGET" -c rules.tsv -I -r zap-report.html -J zap-report.json -w zap-report.md || rc=$?
          [ -s zap/zap-report.json ] || { echo "::error::ZAP produced no report (exit $rc)"; exit 1; }
          [ "$rc" -le 2 ] || { echo "::error::ZAP baseline failed (exit $rc)"; exit "$rc"; }
          [ "$rc" -ne 1 ] || { echo "::error::ZAP: a rule configured as FAIL in .zap/rules.tsv matched"; exit 1; }
      - name: Gate (fail on High, warn on Medium)
        run: |
          ignored=$(awk -F'\t' '!/^#/ && $2 == "IGNORE" { print $1 }' .zap/rules.tsv | jq -R . | jq -sc .)
          alerts=$(jq -c --argjson ign "$ignored" '[.site[].alerts[] | select((.pluginid | tostring) as $id | $ign | index($id) | not)]' zap/zap-report.json)
          jq -r '.[] | select(.riskcode == "2" or .riskcode == "1") | "::warning title=ZAP \(.riskdesc)::\(.name) [\(.pluginid)] (\(.count) URLs)"' <<< "$alerts"
          high=$(jq '[.[] | select(.riskcode == "3")]' <<< "$alerts")
          if [ "$(jq length <<< "$high")" -gt 0 ]; then
            jq -r '.[] | "::error title=ZAP \(.riskdesc)::\(.name) [\(.pluginid)] (\(.count) URLs)"' <<< "$high"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: zap-report
          path: zap/zap-report.*
          retention-days: 14
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  # A new install needs no .env, an existing one keeps working with its .env: both compose files must render either way
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compose config without .env
        run: |
          test ! -e .env
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml --profile backup --profile bundled config -q
          docker compose -f compose.prod.yaml config -q
          docker compose -f compose.prod.yaml --profile backup --profile bundled config -q
      - name: Compose config with .env.example
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml --profile backup --profile bundled config -q
          docker compose -f compose.prod.yaml config -q
          docker compose -f compose.prod.yaml --profile backup --profile bundled config -q
          rm .env
  docker:
    runs-on: ubuntu-latest
    # push events upload the candidate image to GHCR; PRs only build+scan locally
    permissions:
      contents: read
      packages: write # literal on purpose: permissions don't accept expressions; PRs never push and fork PRs get a read-only token anyway
      security-events: write # Trivy SARIF upload (push only, same reasoning)
    strategy:
      matrix: { service: [backend, gateway, web] }
    env:
      SERVICE: ${{ matrix.service }}
      # push (main / v* tags) or a dispatch on main / a v* tag: push the candidate to GHCR; everything else builds locally
      PUBLISHABLE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Image name (GHCR needs lowercase)
        id: img
        run: repo="${GITHUB_REPOSITORY#*/}"; echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${repo,,}-${SERVICE}" >> "$GITHUB_OUTPUT"   # friendflix-<svc>; forks get <repo>-<svc>
      # SOURCE_DATE_EPOCH = commit time: image/history timestamps, rewrite-timestamp, BUILD_TIME and the `created` label
      # all derive from it, never from the clock, so a rebuild of the commit reproduces them
      - name: Release version (version.json) and build time (commit time)
        id: ver
        run: |
          set -euo pipefail
          sde=$(git log -1 --format=%ct)
          {
            echo "version=$(jq -er .version version.json)"
            echo "codename=$(jq -er .codename version.json)"
            echo "sde=$sde"
            echo "build_time=$(date -u -d "@$sde" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      # ---- pull_request: build locally, scan, discard ----
      - name: Build (PR / other dispatch, not pushed)
        if: env.PUBLISHABLE != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          load: true
          tags: friendflix-${{ matrix.service }}:ci
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.ver.outputs.sde }}
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_CODENAME=${{ steps.ver.outputs.codename }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan (PR / other dispatch)
        if: env.PUBLISHABLE != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: friendflix-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # ---- push (main / v* tags) or dispatch: build once, push candidate tag, scan that exact digest ----
      - name: Log in to GHCR
        if: env.PUBLISHABLE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: OCI labels
        id: meta
        if: env.PUBLISHABLE == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.img.outputs.name }}
          # default would be the clock; the commit time keeps the label (part of the image config) reproducible
          labels: |
            org.opencontainers.image.created=${{ steps.ver.outputs.build_time }}
      - name: Build and push candidate
        id: build
        if: env.PUBLISHABLE == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          # push = image exporter; rewrite-timestamp clamps every file mtime to SOURCE_DATE_EPOCH (reproducible layers)
          outputs: type=image,name=${{ steps.img.outputs.name }}:ci-${{ github.sha }},push=true,oci-mediatypes=true,compression=gzip,rewrite-timestamp=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.ver.outputs.sde }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.ver.outputs.build_time }}
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_CODENAME=${{ steps.ver.outputs.codename }}
          # No cache import for what gets published: rewrite-timestamp only clamps mtimes NEWER than SOURCE_DATE_EPOCH, so
          # a layer reused from an older commit's cache keeps that build's (older) mtimes and the image would differ from
          # a clean rebuild. The fresh layers are still exported as cache for PR builds.
          no-cache: true
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # SPDX SBOM + full SLSA provenance stored next to the image (index digest); publish.yml re-uses the SBOM.
          # They are separate manifests in the index (with build times); the linux/amd64 image manifest is what reproduces.
          sbom: true
          provenance: mode=max
      # report first (never fails) so code scanning also gets the findings of a run that the gate below fails
      - name: Scan pushed digest (SARIF for code scanning)
        if: env.PUBLISHABLE == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: env.PUBLISHABLE == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
      - name: Scan pushed digest (gate)
        if: env.PUBLISHABLE == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          format: table
          output: ""
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
  # Reproducible builds (OpenSSF build_reproducible, docs/reproducible-builds.md): each image is rebuilt from scratch by
  # scripts/reproduce-image.sh (fresh docker-container builder with BUILDKIT_IMAGE, --no-cache, context = git archive,
  # SOURCE_DATE_EPOCH = commit time, rewrite-timestamp, no SBOM/provenance) and its image manifest digest must match:
  #   push / publishable dispatch  the ci-<sha> candidate the docker job pushed (other runner, minutes earlier; its labels
  #                                and build-arg ENVs are copied, see the script) - proves the published bytes reproduce
  #   pull_request / other         a second rebuild in another fresh builder (two clean builds, compared)
  # Runs on PRs too (per service in parallel, only after `docker` passed) so a change that breaks reproducibility is caught
  # before merge, and publish waits for it. Attestations are not compared: they are separate manifests carrying build times.
  # Not scheduled: a later rebuild differs as soon as Alpine ships a newer apk package (see the Dockerfiles).
  reproducible:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, packages: read }
    strategy:
      fail-fast: false
      matrix: { service: [backend, gateway, web] }
    env:
      SERVICE: ${{ matrix.service }}
      PUBLISHABLE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Log in to GHCR
        if: env.PUBLISHABLE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Rebuild and compare with the pushed candidate
        if: env.PUBLISHABLE == 'true'
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"; img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${repo,,}-${SERVICE}:ci-${GITHUB_SHA}"
          digest=$(scripts/reproduce-image.sh "$SERVICE" --compare "$img")
          echo "### $SERVICE reproduced: \`$digest\` (= $img, linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build twice from scratch and compare
        if: env.PUBLISHABLE != 'true'
        run: |
          set -euo pipefail
          a=$(scripts/reproduce-image.sh "$SERVICE" --out "$RUNNER_TEMP/a.tar")
          b=$(scripts/reproduce-image.sh "$SERVICE" --out "$RUNNER_TEMP/b.tar")
          if [ "$a" != "$b" ]; then
            echo "::error title=Not reproducible::$SERVICE: two clean builds of $GITHUB_SHA differ ($a vs $b)"
            scripts/reproduce-image.sh --diff "$RUNNER_TEMP/a.tar" "$RUNNER_TEMP/b.tar"
            exit 1
          fi
          echo "### $SERVICE reproducible: two clean builds -> \`$a\`" >> "$GITHUB_STEP_SUMMARY"
  # images are only published after every check above passed (main -> latest + sha, v* tags -> semver)
  # signing/attesting (id-token, attestations) happens only here, i.e. only on push events
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: [test, e2e, dast, secrets, docker, reproducible]
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: ./.github/workflows/publish.yml
