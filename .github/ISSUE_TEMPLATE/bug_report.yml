name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems do not belong here** – please follow [SECURITY.md](https://github.com/LetsManu/friendflix/blob/main/SECURITY.md).
        Never paste passwords, tokens or `/media/c/…` addresses.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FriendFlix version
      description: Admin → Version, or the version in the footer (e.g. 1.0.0 · Arancini)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: e.g. iPhone 15 Pro, iOS 27, home-screen app / Windows 11, Chrome 140 / LG webOS TV
  - type: textarea
    id: log
    attributes:
      label: Diagnose log (player, AirPlay, casting)
      description: Copy it from the Diagnose page. It contains no addresses or tokens.
      render: text
